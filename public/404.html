<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#09090b" />
    <title>404: Página no encontrada</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #09090b;
        color: #ededed;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .error-page {
        width: min(100% - 48px, 600px);
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        margin: 0;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 500;
        letter-spacing: -0.06em;
      }

      p {
        margin: 18px 0 0;
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.7;
      }

      .disclosure {
        margin-top: 8px;
        color: #71717a;
        font-size: 13px;
      }

      footer {
        padding: 16px 0;
        border-top: 1px solid #27272a;
        color: #71717a;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <section aria-labelledby="error-title">
        <h1 id="error-title">404: NO ENCONTRADO</h1>
        <p>La página que buscas no existe o ya no está disponible.</p>
        <p class="disclosure">Demo educativa; esta página no es un aviso oficial de Vercel.</p>
      </section>
      <footer>Código de estado: 404</footer>
    </main>
  </body>
</html>
